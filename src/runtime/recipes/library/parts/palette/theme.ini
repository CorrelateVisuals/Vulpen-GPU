# The theme the palette part reads: a color for each role a part draws in, as red, green
# and blue from 0 to 1, linear, with alpha after when it is not opaque. Every role
# contracts/Palette.h names needs one, and a key that is no role is a mistake (A02).
background = 0.005 0.005 0.005
panel      = 0.0175 0.0175 0.0175
border     = 0.100 0.100 0.100
text       = 0.800 0.820 0.850
accent     = 0.200 0.450 0.900
error      = 0.800 0.150 0.120
warning    = 0.850 0.600 0.100
muted      = 0.250 0.265 0.290
# Code, as the editor shows it.
keyword    = 0.500 0.300 0.850
type       = 0.150 0.600 0.650
string     = 0.400 0.650 0.200
number     = 0.850 0.450 0.180
comment    = 0.180 0.200 0.230
directive  = 0.800 0.300 0.500
# A tint of the accent, for what the pointer is over on a thing selected.
highlight  = 0.450 0.650 1.000
# The ramp the graph's heat fills a box on, from what costs least to what costs most: dark,
# so the text over it reads, its hue rising from green through yellow to red, the cold end
# near the panel's ground, so a graph that costs little looks quiet.
cold       = 0.020 0.045 0.028
cool       = 0.030 0.120 0.040
mild       = 0.200 0.160 0.020
warm       = 0.300 0.090 0.012
hot        = 0.400 0.028 0.020
# What a box in the graph is, its border and its name: a node and a view in the accent's
# blues, and a manifest, which names them, in a deeper azure of its own; a folder warm; a
# file by its kind, each hue the one its relations take where it has one, as docs in the
# string's green, C++ in the keyword's violet and the build in the number's orange, the
# shader stages a family of the type's teal; hidden ones muted, and any other file as
# plain text.
node       = 0.200 0.450 0.900
view       = 0.450 0.650 1.000
folder     = 0.700 0.560 0.280
file       = 0.550 0.570 0.600
hidden     = 0.250 0.265 0.290
markdown   = 0.400 0.650 0.200
python     = 0.800 0.700 0.200
cpp        = 0.500 0.300 0.850
header     = 0.650 0.450 0.900
cmake      = 0.850 0.450 0.180
glsl       = 0.150 0.600 0.650
vert       = 0.120 0.620 0.450
frag       = 0.200 0.520 0.750
comp       = 0.100 0.400 0.620
tesc       = 0.250 0.650 0.550
tese       = 0.300 0.600 0.700
geom       = 0.350 0.550 0.600
manifest   = 0.050 0.250 1.000
shell      = 0.550 0.700 0.350
ini        = 0.600 0.500 0.400
