# The keymap the keys part reads: a chord, = and the line it runs, as if typed at the
# terminal, which shows it and what it answers, so a key does nothing a typed command
# cannot and teaches the line it runs. A chord holds shift, control, alt or super, joined
# by +, then presses a key named as the input command names it, + and = too. Hold control
# for a letter: with no modifier, or another, the letter types as well. A key no chord
# takes goes to the node in focus. A key there is not, a chord given twice, a line no
# command takes or no terminal to run it stops the keys part, naming the line (A02).

control+s       = write
# The = key, which types + with shift; a + key, as the keypad's; and either minus.
control+=       = zoom in
shift+control+= = zoom in
control++       = zoom in
control+-       = zoom out
control+0       = zoom reset
f1              = mode toggle
# Where the name at the editor's caret comes from, again for the next place.
f12             = jump
