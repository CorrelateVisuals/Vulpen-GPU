# What a right press opens, by the kind of thing it is on: a section a kind, as [node],
# and a line each of what the terminal does with it, as the terminal takes it, {} where
# the name of what was pressed goes, a node's or a view's, or a file's or a folder's path,
# and {/} its folder, so a line makes something in it, or beside a file. A menu shows a
# line a word a column, the words that may follow a word beside it, as Tab lists them,
# and for a placeholder that stands for a few known words, as <recipe>, what the terminal
# completes it with, or past sixteen of them the placeholder, whose press lists them in
# the terminal. A press on the word that ends a line hands the line to the terminal,
# which runs it as typed, or begins it up to the word a placeholder wants, as <name>, for
# the person to type. A background's menu ends with [project]'s lines, muted. A line no
# command takes, or a line a fourth column would hold, stops the menus part, naming the
# line (A02).

# The ground of a view's top, {} its folder.
[ground]
node new draw <name>
node new dispatch <name>
node new vertex <name>
node new fragment <name>
node new cpp <name>
node new group <name>
recipe drop <recipe> <name>
file new {}/<name>
cd ..
cd /

# The ground inside a node, {} the node.
[inside]
node new draw {}.<name>
node new dispatch {}.<name>
node new vertex {}.<name>
node new fragment {}.<name>
node new cpp {}.<name>
node new group {}.<name>
file new {/}/<name>
cd ..
cd /

# The ground of a folder the graph shows, {} the folder.
[level]
file new {}/<name>
cd ..
cd /

[node]
cd {}
info {}
node new draw {}.<name>
node new dispatch {}.<name>
node new vertex {}.<name>
node new fragment {}.<name>
node new cpp {}.<name>
node new group {}.<name>
node rename {} <name>
node remove {}
file new {/}/<name>

# A node a drop copied from the library, which a sync brings up to the library's.
[dropped]
cd {}
info {}
node new draw {}.<name>
node new dispatch {}.<name>
node new vertex {}.<name>
node new fragment {}.<name>
node new cpp {}.<name>
node new group {}.<name>
node rename {} <name>
node remove {}
recipe sync {}
file new {/}/<name>

[file]
open {}
file new {/}/<name>
file rename {} <file>
file copy {} <file>
file remove {}

[folder]
cd {}
file new {}/<name>
file rename {} <file>
file copy {} <file>
file remove {}
file remove force {}

# A view the view shown hosts, {} its name.
[view]
view switch {}
info {}
{}: view save
{}: view save as <name>
{}: view rename <name>
view close {}
view remove {}
{}: node new draw <name>
{}: node new dispatch <name>
{}: node new vertex <name>
{}: node new fragment <name>
{}: node new cpp <name>
{}: node new group <name>
file new {/}/<name>

# A folder in a view no node names yet, as node remove keep leaves it, {} the node it
# would be: made one, with a kind's words, or as an empty node, or moved out, or deleted.
[stray]
node new draw {}
node new dispatch {}
node new vertex {}
node add {}
file rename {/} <file>
file remove {/}
file remove force {/}

[connection]
disconnect {}

# A relation's curve, {} each of the files it joins.
[relation]
open {}

# A tab, {} the file it shows.
[tab]
close left {}
close right {}
close all {}

# What a background offers for the whole project, after its own lines, muted.
[project]
view new <name>
view load <project>
view save
view save as <name>
view switch <view>
view close <view>
view remove <project>
view list
mode edit
mode perform
mode toggle
zoom in
zoom out
zoom reset
help
