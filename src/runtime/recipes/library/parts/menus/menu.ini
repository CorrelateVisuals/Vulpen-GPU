# The menus the menus part reads: a menu and an item, joined by /, = and the line the
# item sends, as a line typed at the terminal, so a menu does nothing a typed line cannot.
# The menus show in the order their first items come, and each item in the order it
# comes. A line that holds a placeholder, as <file>, wants a word: its item shows ...,
# and types the line up to the placeholder into the terminal's line, for the rest to be
# typed there. An item given twice or a line no command takes stops the menus part,
# naming the line (A02).

file/open           = open <path>
file/write          = write
file/close          = close
file/find           = find <value>
file/quit           = quit

view/new            = view new <project>
view/load           = view load <project>
view/save           = view save
view/save as        = view save as <name>
view/switch         = view switch <view>
view/close          = view close <view>
view/list           = view list

node/new draw       = node new draw <name>
node/new dispatch   = node new dispatch <name>
node/add            = node add <name>
node/remove         = node remove <node>
node/info           = info
node/ls             = ls

recipe/list         = recipe list
recipe/drop         = recipe drop <recipe> <name>
recipe/sync         = recipe sync <node>

mode/edit           = mode edit
mode/perform        = mode perform
mode/toggle         = mode toggle

zoom/in             = zoom in
zoom/out            = zoom out
zoom/reset          = zoom reset

help/commands       = help
help/costs          = probe stats

# What a right press on a tab opens, for the tab's file, which ends each line.
tab/close all to left  = close left <file>
tab/close all to right = close right <file>
