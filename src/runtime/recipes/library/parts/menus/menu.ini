# What a right press opens, by the kind of thing it is on: a section a kind, as [node],
# and a line each of what the terminal does with it, as the terminal takes it, {} where
# the name of what was pressed goes, a node's or a view's, or a file's or a folder's path.
# A menu shows a line a word a column, the words that may follow a word beside it, as Tab
# lists them, and for a placeholder that stands for a few known words, as <recipe>, what
# the terminal completes it with. A press on the word that ends a line hands the line to
# the terminal, which runs it as typed, or begins it up to the word a placeholder wants,
# as <name>, for the person to type. [all]'s lines end every menu, muted. A line no
# command takes, or a line a fourth column would hold, stops the menus part, naming the
# line (A02).

# The ground of a view's top, {} its folder.
[ground]
node new draw <name>
node new dispatch <name>
recipe drop <recipe> <name>
file new {}/<name>
cd ..
cd /

# The ground of a folder the graph shows, or of a node's inside, {} the folder.
[level]
file new {}/<name>
cd ..
cd /

[node]
cd {}
info {}
node rename {} <name>
node remove {}

# A node a drop copied from the library, which a sync brings up to the library's.
[dropped]
cd {}
info {}
node rename {} <name>
node remove {}
recipe sync {}

[file]
open {}
file rename {} <file>
file copy {} <file>
file remove {}

[folder]
cd {}
file new {}/<name>
file rename {} <file>
file copy {} <file>
file remove {}

# A view the view shown hosts, {} its name.
[view]
view switch {}
info {}
{}: view save
{}: view save as <name>
{}: view rename <name>
view close {}

[connection]
disconnect {}

# A relation's curve, {} each of the files it joins.
[relation]
open {}

# A tab, {} the file it shows.
[tab]
close left {}
close right {}
close all {}

# What the terminal does anywhere, at the end of every menu.
[all]
open <path>
write
close
find <value>
file new <file>
file rename <file> <file>
file copy <file> <file>
file remove <file>
view new <name>
view load <project>
view save
view save as <name>
view switch <view>
view close <view>
view list
node new draw <name>
node new dispatch <name>
node add <name>
node remove <node>
info
ls
recipe list
recipe drop <recipe> <name>
recipe sync <node>
mode edit
mode perform
mode toggle
zoom in
zoom out
zoom reset
help
probe stats
quit
