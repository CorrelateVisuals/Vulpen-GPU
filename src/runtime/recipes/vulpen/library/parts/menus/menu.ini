# What a right press opens. Each section is a kind of thing pressed, as [node], and
# each line in it a line as the terminal takes it (V06). A menu shows a line a word a
# column, and the words that may follow a word beside it, as Tab lists them. A press on
# the word that ends a line runs it in the terminal, or begins it up to the word it
# wants, as <name>, for the person to type.
#
# What was pressed:
#   {}       its name: a node's or a view's, a port's as node.port, or a path
#   {/}      the folder pressed, or the one holding the file pressed, so a line makes
#            something in it or beside the file
#   {node}   a port's node
#   {view}   the view lines go to
#   {image}  a port that is an image its node writes; the line shows on such ports alone
#   {1} {2}  with two pressed, the first selected and the second
#
# What a column lists for a placeholder. A line whose placeholder stands for nothing
# shows nowhere.
#   <recipe> <node> <view> <connection>
#              what the terminal completes it with; past sixteen, the placeholder,
#              whose press lists them in the terminal
#   <link>     the lines connecting a loose port to the ports alike to it; for one node
#              pressed, its port, then the other end
#   <joined>   the connections joining what was pressed
#   <key>      the values of a node that a param may set
#   <path>     the files in what was pressed
#   <start>    the draw stages its files lack: Name.frag beside a lone Name.vert,
#              Name.vert beside a lone Name.frag, Name.tese beside a Name.tesc, else a
#              .vert and a .frag; never a .geom, which only adds to a draw, nor C++
#   <type>     the types a shader pressed may declare a pass block field of, or a .cpp
#              a param or an output of
#   <field>    the fields of its node's shaders that nothing fills yet, for a .cpp
#              pressed to fill
#   <writer>   what the view's other nodes write: images and buffers for a shader's
#              field to read, or C++ outputs for a .cpp
#
# With several pressed, the lines that join them run once, and under a rule after them,
# those that name {} and want no word typed run once for each. A node's section lists
# first the lines that join it to others and change what it runs, as that is what a
# right press on a node is for. Any other section lists new first, as making something
# is what a right press is reached for most. A background's menu ends with its view
# lines, plain as new is, since views are what a project is made of; then [project]'s,
# muted. A line no command takes, or one that needs a fourth column, stops the menus
# part, naming the line (A02).

# The ground of a view's top, {} its folder, which is node root's (RV08).
[ground]
new {}/<start>
new {}/<name>
recipe drop <recipe> <name>
cd ..
cd /
view new <name>
view load <project>
view save
view save as <name>
view switch <view>
view close <view>
view remove <project>
view list

# The ground inside a node, {} the node.
[inside]
new {/}/<start>
new {/}/<name>
cd ..
cd /
view new <name>
view load <project>
view save
view save as <name>
view switch <view>
view close <view>
view remove <project>
view list

# The ground of a folder the graph shows, {} the folder.
[level]
new {}/<name>
cd ..
cd /
view new <name>
view load <project>
view save
view save as <name>
view switch <view>
view close <view>
view remove <project>
view list

[node]
connect <link>
disconnect <joined>
param set {} <key> <value>
open {/}/<path>
new {/}/<start>
new {/}/<name>
probe stats {}
cd {}
info {}
rename {/} <file>
copy {/} <file>
remove {/}
remove force {/}
recipe make {} <name>

# A node a drop copied from a recipe, which a sync brings up to the recipe's.
[dropped]
connect <link>
disconnect <joined>
param set {} <key> <value>
open {/}/<path>
new {/}/<start>
new {/}/<name>
probe stats {}
cd {}
info {}
rename {/} <file>
copy {/} <file>
remove {/}
remove force {/}
recipe sync {}
recipe make {} <name>

# A port on a node's box no connection joins, {} it as node.port: the ports alike to it,
# and the files of its node, which declare it.
[port]
connect <link>
view show {image}
open {/}/<path>
info {node}

# A port on a node's box a connection joins, {} it as node.port.
[joined]
disconnect <joined>
view show {image}
open {/}/<path>
info {node}

# The manifest of the view shown, at its top, {} its path: where the project is kept.
[manifest]
open {}
info {}
view save
view save as <name>
view rename <name>
view close {view}
view close force {view}
view show
copy {} <file>

# A file, {} its path; a shader's adds a param or a port to its node, a field of its pass
# block, and a .cpp's a line in bind() and a member, which param set and connect then
# find.
[file]
new {/}/<name>
param declare {} <type> <name>
param declare {} <field>
connect declare <writer> {} <name>
open {}
info {}
rename {} <file>
copy {} <file>
remove {}

[folder]
new {}/<name>
cd {}
info {}
rename {} <file>
copy {} <file>
remove {}
remove force {}

# A folder holding a project's manifest, as projects/ shows them, {} the folder: view load
# hosts it.
[project-folder]
view load {}
new {}/<name>
cd {}
info {}
rename {} <file>
copy {} <file>
remove {}
remove force {}

# Two nodes selected: the lines that join them, {1} the first selected and {2} the second,
# then, under a rule, those run once for each, {} each.
[pair]
connect <link>
disconnect <joined>
node move {1} {2}
info {}
probe stats {}
remove {/}
remove force {/}

# More nodes selected: the lines connecting any two of them, then those run once for
# each, as a node move under the node chosen, which keeps their order.
[nodes]
connect <link>
node move {} <node>
info {}
probe stats {}
remove {/}
remove force {/}

# Several folders selected, {} each.
[folders]
info {}
remove {}
remove force {}

# A view the view shown hosts, {} its name.
[view]
new {/}/<name>
view switch {}
info {}
{}: view save
{}: view save as <name>
{}: view rename <name>
view close {}
view close force {}
view remove {}

# A folder in a view no node names yet, as node remove keep leaves it, {} the node it
# would be: made one by node add, or moved out, or deleted.
[stray]
node add {}
info {/}
rename {/} <file>
remove {/}
remove force {/}

[connection]
disconnect {}

# A relation's curve, {} each of the files it joins.
[relation]
open {}

# Text selected in an editor or a terminal, {} the node showing it.
[selection]
copy

# A tab, {} the file it shows.
[tab]
close left {}
close right {}
close all {}

# What a background offers for the whole project, after its own lines and its view lines,
# muted.
[project]
mode edit
mode perform
mode toggle
zoom in
zoom out
zoom reset
help
