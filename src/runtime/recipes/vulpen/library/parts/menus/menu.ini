# What a right press opens, by the kind of thing it is on: a section a kind, as [node],
# and a line each of what the terminal does with it, as the terminal takes it, {} where
# the name of what was pressed goes, a node's or a view's, a port's as node.port, or a
# file's or a folder's path, {/} its folder, so a line makes something in it, or beside a
# file, {node} a port's node, {view} the view lines go to, {image} a port that is an image
# its node writes, the line showing on such a port alone, and with two pressed, {1} the
# first selected and {2} the second. A menu shows a line a word a column, the words that may follow a word beside
# it, as Tab lists them, and for a placeholder that stands for a few known words, what
# they are: for <recipe>, <node>, <view> and <connection> what the terminal completes it
# with, or past sixteen of them the placeholder, whose press lists them in the terminal;
# and from the view lines go to, for <link> the lines connecting a loose port to the ports
# alike to it, for one node its port, then the other end, for <joined> the connections
# joining what was pressed, for <key> the values of a node a param may set, for <path>
# the files in what was pressed, after its folder and a /, and for <start> a file new
# starts with code that changes what a node runs, which it lacks, as Name.cpp beside its
# shaders, or Name.frag beside a lone Name.vert; a line whose placeholder of these stands
# for none shows nowhere. A press on
# the word that ends a line hands the line to the terminal, which runs it as typed, or
# begins it up to the word a placeholder wants, as <name>, for the person to type. With
# several pressed, the lines that join them run once, and under a rule after them those
# that name {} and want no word typed run once for each. A background's menu ends with
# [project]'s lines, muted. A line no command takes, or a line a fourth column would
# hold, stops the menus part, naming the line (A02). A node's section lists first the
# lines that join it to others and change what it runs, as they are what a right press on
# a node is for; any other lists new first where it has it, as making something is what a
# right press is reached for most, so it is always in the same place.

# The ground of a view's top, {} its folder.
[ground]
new {}/<name>
recipe drop <recipe> <name>
cd ..
cd /

# The ground inside a node, {} the node.
[inside]
new {/}/<name>
cd ..
cd /

# The ground of a folder the graph shows, {} the folder.
[level]
new {}/<name>
cd ..
cd /

[node]
connect <link>
disconnect <joined>
param set {} <key> <value>
open {/}/<path>
new {/}/<start>
new {/}/<name>
probe stats {}
cd {}
info {}
rename {/} <file>
copy {/} <file>
remove {/}
remove force {/}
recipe make {} <name>

# A node a drop copied from a recipe, which a sync brings up to the recipe's.
[dropped]
connect <link>
disconnect <joined>
param set {} <key> <value>
open {/}/<path>
new {/}/<start>
new {/}/<name>
probe stats {}
cd {}
info {}
rename {/} <file>
copy {/} <file>
remove {/}
remove force {/}
recipe sync {}
recipe make {} <name>

# A port on a node's box no connection joins, {} it as node.port: the ports alike to it,
# and the files of its node, which declare it.
[port]
connect <link>
view show {image}
open {/}/<path>
info {node}

# A port on a node's box a connection joins, {} it as node.port.
[joined]
disconnect <joined>
view show {image}
open {/}/<path>
info {node}

# The manifest of the view shown, at its top, {} its path: where the project is kept.
[manifest]
open {}
view save
view save as <name>
view rename <name>
view close {view}
view close force {view}
view show
copy {} <file>

[file]
new {/}/<name>
open {}
rename {} <file>
copy {} <file>
remove {}

[folder]
new {}/<name>
cd {}
rename {} <file>
copy {} <file>
remove {}
remove force {}

# A folder holding a project's manifest, as projects/ shows them, {} the folder: view load
# hosts it.
[project-folder]
view load {}
new {}/<name>
cd {}
rename {} <file>
copy {} <file>
remove {}
remove force {}

# Two nodes selected: the lines that join them, {1} the first selected and {2} the second,
# then, under a rule, those run once for each, {} each.
[pair]
connect <link>
disconnect <joined>
node move {1} {2}
info {}
probe stats {}
remove {/}
remove force {/}

# More nodes selected: the lines connecting any two of them, then those run once for
# each, as a node move under the node chosen, which keeps their order.
[nodes]
connect <link>
node move {} <node>
info {}
probe stats {}
remove {/}
remove force {/}

# Several folders selected, {} each.
[folders]
remove {}
remove force {}

# A view the view shown hosts, {} its name.
[view]
new {/}/<name>
view switch {}
info {}
{}: view save
{}: view save as <name>
{}: view rename <name>
view close {}
view remove {}

# A folder in a view no node names yet, as node remove keep leaves it, {} the node it
# would be: made one by node add, or moved out, or deleted.
[stray]
node add {}
rename {/} <file>
remove {/}
remove force {/}

[connection]
disconnect {}

# A relation's curve, {} each of the files it joins.
[relation]
open {}

# Text selected in an editor or a terminal, {} the node showing it.
[selection]
copy

# A tab, {} the file it shows.
[tab]
close left {}
close right {}
close all {}

# What a background offers for the whole project, after its own lines, muted.
[project]
view new <name>
view load <project>
view save
view save as <name>
view switch <view>
view close <view>
view remove <project>
view list
mode edit
mode perform
mode toggle
zoom in
zoom out
zoom reset
help
