# The graph editor's look at this view, which a restart keeps: each box placed by
# hand, from the graph's top left at zoom 1, or from the top left of the boxes
# inside the box holding it, and each box made larger by hand, as wide and as tall
# in pixels at zoom 1. The graph part writes it as boxes move; delete it to lay the
# boxes out from the graph again. What a box is colors it, as theme.ini says.
place /view.vlp = 42 46
place outside left = 42 146
place triangle = 576 192
place triangle outside left = -48 48
place triangle/Triangle.cpp = 576 48
place triangle/Triangle.frag = 1344 46
place triangle/Triangle.vert = 945 46
