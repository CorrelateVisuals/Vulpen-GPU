# The graph editor's look at this view, which a restart keeps: each box placed by
# hand, from the graph's top left at zoom 1, or from the top left of the boxes
# inside the box holding it, each box made larger by hand, as wide and as tall in
# pixels at zoom 1, and the role a kind of node's boxes are drawn in, as color
# dispatch = number: draw, dispatch, code, data, group or view, and a role
# theme.ini names. The graph part writes it as boxes move, keeping the colors;
# delete it to lay the boxes out from the graph again.
place /view.vlp = 480 170
place triangle = 686 167
place triangle/Triangle.cpp = 0 0
place triangle/Triangle.frag = 0 78
place triangle/Triangle.glsl = 518 110
place triangle/Triangle.vert = 0 156
size triangle = 783 358
